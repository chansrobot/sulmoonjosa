<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청춘비서 | 설문 관리자 패널</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f1f5f9; padding: 40px; display: none; }
        .admin-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        h1 { color: #1e293b; }
        .btn-clear { padding: 10px 20px; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; }
        
        /* 가로 스크롤이 가능하도록 수정된 부분 */
        .table-container { overflow-x: auto; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
        th { background: #0f172a; color: white; font-weight: 600; }
        tr:hover { background: #f8fafc; }
    </style>
</head>
<body>

    <div class="admin-header">
        <h1>📊 설문 결과 관리자 패널 (전체 문항)</h1>
        <button class="btn-clear" onclick="clearData()">데이터 전체 초기화</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>제출 시간</th>
                    <th>Q1. 나이</th>
                    <th>Q2. 희망 지역</th>
                    <th>Q3. 독립 시기</th>
                    <th>Q4. 동거인</th>
                    <th>Q5. 주거 형태</th>
                    <th>Q6. 예산(보증/월/관리비)</th>
                    <th>Q7. 준비 단계</th>
                    <th>Q8. 현재 거주</th>
                    <th>Q9. 무주택</th>
                    <th>Q10. 경제활동</th>
                    <th>Q11. 월 소득</th>
                    <th>Q12. 가용 자금</th>
                    <th>Q13. 정책 지식</th>
                    <th>Q14. 청약통장</th>
                    <th>Q15. 보유 대출</th>
                    <th>Q16. 대출(잔액/상환)</th>
                    <th>Q17. 주거대출 의향</th>
                    <th>Q18. 신용점수</th>
                    <th>Q19. 월 고정지출</th>
                    <th>Q20. 필요 도움</th>
                </tr>
            </thead>
            <tbody id="resultBody">
                <!-- 데이터가 여기에 렌더링됨 -->
            </tbody>
        </table>
    </div>

    <script>
        // --- 🔒 보안: 비밀번호 암호화(난독화) 처리 ---
        // 'waylib2026'이라는 글자를 코드에 직접 노출하지 않고,
        // 각 글자의 아스키코드에 +5를 한 숫자 배열로 숨겨둠
        const secretCodes = [124, 102, 126, 113, 110, 103, 55, 53, 55, 59];
        
        const userInput = prompt("관리자 비밀번호를 입력하세요.");

        // 입력받은 비밀번호를 똑같이 변환해서 숫자가 일치하는지 검사
        let isMatch = false;
        if (userInput && userInput.length === secretCodes.length) {
            isMatch = userInput.split('').every((char, index) => {
                return char.charCodeAt(0) + 5 === secretCodes[index];
            });
        }

        if (isMatch) {
            document.body.style.display = "block"; // 비번 일치 시 화면 표시
            renderData();
        } else {
            alert("접근 권한이 없습니다.");
            window.location.href = "index.html"; // 강제 쫓아내기
        }

        // --- 📊 데이터 렌더링 ---
        function renderData() {
            const tbody = document.getElementById('resultBody');
            const surveys = JSON.parse(localStorage.getItem('waylib_surveys')) || [];
            
            if (surveys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="21" style="text-align:center;">제출된 데이터가 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = surveys.map(s => `
                <tr>
                    <td>${s.timestamp || '-'}</td>
                    <td>${s.q1_age ? s.q1_age + '세' : '-'}</td>
                    <td>${s.q2_undecided ? '미정' : `${s.q2_city||''} ${s.q2_gu||''} ${s.q2_dong||''}`}</td>
                    <td>${s.q3_timeline || '-'}</td>
                    <td>${s.q4_companion || '-'}${s.q4_other ? `(${s.q4_other})` : ''}</td>
                    <td>${s.q5_house_type || '-'}${s.q5_other ? `(${s.q5_other})` : ''}</td>
                    <td>${s.q6_no_budget ? '미정' : `보:${s.q6_deposit||0} 월:${s.q6_rent||0} 관:${s.q6_fee||0}`}</td>
                    <td>${s.q7_stage || '-'}</td>
                    <td>${s.q8_current_house || '-'}${s.q8_other ? `(${s.q8_other})` : ''}</td>
                    <td>${s.q9_homeless || '-'}</td>
                    <td>${s.q10_job || '-'}${s.q10_other ? `(${s.q10_other})` : ''}</td>
                    <td>${s.q11_income || '-'}</td>
                    <td>${s.q12_cash || '-'}</td>
                    <td>${s.q13_policy || '-'}</td>
                    <td>${s.q14_chungyak || '-'}${s.q14_1_count ? `(${s.q14_1_count}회/${s.q14_1_amount}만)` : ''}</td>
                    <td>${s.q15_loan_type || '-'}</td>
                    <td>잔액:${s.q16_loan_total||0}만 / 상환:${s.q16_loan_month||0}만</td>
                    <td>${s.q17_will_loan || '-'}</td>
                    <td>${s.q18_credit || '-'}</td>
                    <td>총 ${s.q19_ex_total||0}만 원</td>
                    <td style="font-weight:bold; color:#2875d6;">${s.q20_help || '-'}</td>
                </tr>
            `).join('');
        }

        // --- 🗑️ 데이터 초기화 ---
        function clearData() {
            if(confirm("정말 모든 설문 데이터를 삭제하시겠습니까? (복구 불가)")) {
                localStorage.removeItem('waylib_surveys');
                renderData();
            }
        }
    </script>
</body>
</html>
