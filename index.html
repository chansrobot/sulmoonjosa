<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자립 자가진단 | 청춘비서</title>
    <style>
        :root {
            --navy: #071c39; --blue: #2875d6; --blue-light: #eaf4ff;
            --text: #16263b; --text-light: #6b7a8c; --white: #ffffff;
            --border: rgba(10, 50, 100, 0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Pretendard, sans-serif; }
        body { background: #f4f8fe; color: var(--text); padding: 50px 20px; }
        
        .form-container {
            max-width: 700px; margin: 0 auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px; padding: 50px;
            box-shadow: 0 15px 40px rgba(7, 28, 57, 0.08);
            border: 1px solid rgba(255, 255, 255, 1);
        }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 32px; color: var(--navy); letter-spacing: -0.05em; }
        .header p { color: var(--text-light); margin-top: 10px; }

        .step-title {
            font-size: 18px; color: var(--blue); font-weight: 800;
            margin: 40px 0 20px; padding-bottom: 10px;
            border-bottom: 2px solid var(--blue-light);
        }

        .q-box { margin-bottom: 35px; }
        .q-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: var(--navy); }
        
        input[type="text"], input[type="number"] {
            width: 100%; padding: 15px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--white);
            font-size: 15px; transition: 0.2s; margin-bottom: 10px;
        }
        input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-light); }

        .radio-group { display: flex; flex-wrap: wrap; gap: 10px; }
        .radio-label {
            flex: 1 1 calc(50% - 10px);
            padding: 15px; border: 1px solid var(--border); border-radius: 12px;
            text-align: center; cursor: pointer; transition: 0.2s; font-size: 14px;
            background: var(--white); font-weight: 500;
        }
        .radio-group input[type="radio"], .radio-group input[type="checkbox"] { display: none; }
        .radio-group input:checked + .radio-label {
            background: var(--blue); color: var(--white); border-color: var(--blue);
        }

        .submit-btn {
            width: 100%; padding: 20px; margin-top: 20px;
            background: linear-gradient(135deg, #2875d6, #104b91);
            color: white; border: none; border-radius: 16px;
            font-size: 18px; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(40, 117, 214, 0.4); }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header">
        <h1>청춘비서 자립 자가진단</h1>
        <p>정확한 로드맵 설계를 위해 현재 상황을 알려주세요.</p>
    </div>

    <form id="diagnosisForm">
        <!-- 1단계 -->
        <div class="step-title">1단계. 독립 목표</div>
        
        <div class="q-box">
            <div class="q-title">Q1. 현재 나이를 입력해주세요.</div>
            <input type="number" name="age" placeholder="만 나이 입력 (예: 22)" required>
        </div>

        <div class="q-box">
            <div class="q-title">Q2. 독립을 희망하는 지역은 어디인가요?</div>
            <input type="text" name="region_city" placeholder="시·도 (예: 서울특별시)" required>
            <input type="text" name="region_gu" placeholder="시·군·구 (예: 서초구)" required>
        </div>

        <div class="q-box">
            <div class="q-title">Q3. 언제까지 독립하고 싶나요?</div>
            <div class="radio-group">
                <input type="radio" id="t1" name="timeline" value="1개월 이내"><label class="radio-label" for="t1">1개월 이내</label>
                <input type="radio" id="t2" name="timeline" value="3개월 이내"><label class="radio-label" for="t2">3개월 이내</label>
                <input type="radio" id="t3" name="timeline" value="6개월 이내"><label class="radio-label" for="t3">6개월 이내</label>
                <input type="radio" id="t4" name="timeline" value="미정"><label class="radio-label" for="t4">아직 정하지 못함</label>
            </div>
        </div>

        <!-- 2단계 -->
        <div class="step-title">2단계. 희망 주거 조건</div>
        <div class="q-box">
            <div class="q-title">Q4. 희망하는 주거 형태는 무엇인가요? (복수 선택)</div>
            <div class="radio-group">
                <input type="checkbox" id="h1" name="house_type" value="월세"><label class="radio-label" for="h1">월세</label>
                <input type="checkbox" id="h2" name="house_type" value="전세"><label class="radio-label" for="h2">전세</label>
                <input type="checkbox" id="h3" name="house_type" value="공공임대"><label class="radio-label" for="h3">공공임대/행복주택</label>
                <input type="checkbox" id="h4" name="house_type" value="기숙사"><label class="radio-label" for="h4">기숙사/고시원</label>
            </div>
        </div>

        <div class="q-box">
            <div class="q-title">Q5. 주거에 사용할 수 있는 예산을 입력해주세요.</div>
            <input type="number" name="budget_deposit" placeholder="보증금 (만 원 단위)">
            <input type="number" name="budget_rent" placeholder="월세 최대 (만 원 단위)">
        </div>

        <!-- 4단계 (핵심 위주 축약) -->
        <div class="step-title">3단계. 소득 및 자금 상황</div>
        <div class="q-box">
            <div class="q-title">Q6. 월평균 세전소득은 얼마인가요?</div>
            <div class="radio-group">
                <input type="radio" id="i1" name="income" value="소득 없음"><label class="radio-label" for="i1">소득 없음</label>
                <input type="radio" id="i2" name="income" value="100-200"><label class="radio-label" for="i2">100~200만 원</label>
                <input type="radio" id="i3" name="income" value="200-300"><label class="radio-label" for="i3">200~300만 원</label>
                <input type="radio" id="i4" name="income" value="300이상"><label class="radio-label" for="i4">300만 원 이상</label>
            </div>
        </div>

        <button type="submit" class="submit-btn">결과 분석하고 로드맵 생성하기 →</button>
    </form>
</div>

<script>
    document.getElementById('diagnosisForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // 폼 데이터 수집
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        
        // 체크박스(복수선택) 처리
        data.house_type = formData.getAll('house_type').join(', ');

        // 로컬 스토리지에 저장 (DB 역할)
        let surveys = JSON.parse(localStorage.getItem('waylib_surveys')) || [];
        data.timestamp = new Date().toLocaleString();
        surveys.push(data);
        localStorage.setItem('waylib_surveys', JSON.stringify(surveys));

        // 완료 후 대시보드로 이동
        alert('진단이 완료되었습니다! 맞춤형 로드맵을 생성합니다.');
        window.location.href = 'dashboard.html';
    });
</script>

</body>
</html>
